name: Build and Test

on:
  push:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: transcribe-bot-windows-x86_64
            extension: .exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: transcribe-bot-macos-aarch64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: transcribe-bot-linux-x86_64
            container: rust:bookworm
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: transcribe-bot-linux-aarch64
            container: rust:bookworm
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/transcribe-bot${{ matrix.extension || '' }}
          if-no-files-found: error

  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests
        run: cargo test --locked
        env:
          RUST_BACKTRACE: '1'
