[ai]
request_timeout = 30
# OpenAI-compatible Chat Completions base URL. Ollama's local endpoint is the default.
model = "llama3.1:8b-instruct"
base_url = "http://127.0.0.1:11434/v1"
# Optional environment variable containing the bearer token.
# api_key_env = "OPENAI_API_KEY"

[asr]
model_dir = "models/sherpa-onnx-moonshine-base-en-int8"
# Only needed for single-file model.onnx families that cannot be inferred.
# One of: paraformer, sense_voice, nemo_ctc, zipformer_ctc, tdnn
# model_family = "nemo_ctc"
num_threads = 3

[audio]
enable_denoiser = false

[debug]
log_live_transcript = false

[transcription]
endpoint_silence_ms = 400
rolling_ingest_max_ms = 12000
rolling_ingest_context_ms = 1500
retention_days = 30

[discord]
autojoin_suffix = "[Transcribe]"
# Optional fixed destination for autojoin status, live transcript, and exports.
# autojoin_text_channel_id = 123456789012345678

[summary]
enabled = false
post_in_thread = true
include_in_markdown = false
