# Build Linux releases against the CentOS-compatible Cross toolchains instead of
# the runner's system libc.  These images target the glibc 2.17 ABI, so the
# resulting binaries run on systems with glibc 2.36 (and other newer versions).
[target.x86_64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/x86_64-unknown-linux-gnu:main-centos"

[target.aarch64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu:main-centos"
