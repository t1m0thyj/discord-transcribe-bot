[package]
name = "transcribe-bot"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = "0.4"
dashmap = "6"
dotenvy = "0.15"
earshot = "1.2.1"
nnnoiseless = "0.5"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rubato = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "voice", "rustls_backend", "cache", "model"] }
sherpa-onnx = "1.13"
songbird = { version = "0.6", features = ["driver", "receive", "serenity"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
